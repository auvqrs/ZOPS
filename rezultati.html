<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rezultati - ZOPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="banner">
  <img src="zops_logo.png" alt="ZOPS Logo">
  <span>Live Rang Lista - Najbolji YouTuber</span>
</header>

<main class="container">
  <h1>📊 Trenutni Poredak</h1>
  <p id="totalVotes" style="text-align:center; color: var(--accent); font-weight: bold;"></p>
  <p class="subtitle">Bodovanje: 1. mesto (5b), 2. mesto (4b), ... 5. mesto (1b)</p>

  <div id="loading" style="text-align:center; padding: 20px;">
    <div class="spinner"></div> Učitavam rezultate...
  </div>
  
  <div id="resultsList" class="ranking-results"></div>

  <button onclick="window.location.href='index.html'" style="margin-top: 30px; width: 100%; background: #222; border: 1px solid var(--border); color: white; padding: 15px; border-radius: 18px; cursor: pointer;">
    ⬅️ Nazad na glasanje
  </button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
  // Koristimo postojeću instancu ili pravimo novu bez ponovnog deklarisanja 'const' ako već postoji
  const supabaseUrl = 'https://orhialsdenlufsbkgkwg.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yaGlhbHNkZW5sdWZzYmtna3dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTcyMzQsImV4cCI6MjA4NTUzMzIzNH0._pTg-_4MG1pLNIzNPvyIeWmpahZeBLhwABPSg871DTo';
  
  // Provera da li je supabase već inicijalizovan da izbegnemo SyntaxError
  let sbClient;
  if (window.supabase && typeof window.supabase.createClient === 'function') {
      sbClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  } else {
      // U nekim verzijama SDK-a supabase je direktno dostupan
      sbClient = supabase.createClient(supabaseUrl, supabaseKey);
  }

  async function ucitajRezultate() {
    try {
      const { data, error } = await sbClient.from('yt_glasanje').select('*');
      
      if (error) throw error;

      const bodovi = {};
      const ukupnoGlasova = data.length;
      document.getElementById('totalVotes').innerText = `Ukupno glasalo: ${ukupnoGlasova} učenika`;

      // Računanje bodova po ključu ime: poeni
      data.forEach(glas => {
        const sistem = [
          { ime: glas.top1, poeni: 5 },
          { ime: glas.top2, poeni: 4 },
          { ime: glas.top3, poeni: 3 },
          { ime: glas.top4, poeni: 2 },
          { ime: glas.top5, poeni: 1 }
        ];

        sistem.forEach(s => {
          if (s.ime && s.ime !== "Prazno") {
            bodovi[s.ime] = (bodovi[s.ime] || 0) + s.poeni;
          }
        });
      });

      const sortirano = Object.entries(bodovi).sort((a, b) => b[1] - a[1]);
      prikaziTabelu(sortirano);

    } catch (err) {
      document.getElementById('loading').innerHTML = `<span style="color:red;">Greška: ${err.message}</span>`;
      console.error("Supabase error:", err);
    }
  }

  function prikaziTabelu(lista) {
    const container = document.getElementById('resultsList');
    document.getElementById('loading').style.display = 'none';

    if (lista.length === 0) {
      container.innerHTML = "<p style='text-align:center;'>Još uvek nema glasova.</p>";
      return;
    }

    let html = '<table style="width:100%; border-collapse: collapse; margin-top:20px;">';
    html += '<tr style="border-bottom: 2px solid #222; color: var(--accent); font-size: 12px; text-transform: uppercase;">' +
            '<th style="text-align:left; padding:10px;">#</th>' +
            '<th style="text-align:left; padding:10px;">YouTuber</th>' +
            '<th style="text-align:right; padding:10px;">Poena</th></tr>';

    lista.forEach((stavka, index) => {
      let medalja = "";
      if(index === 0) medalja = "🥇 ";
      if(index === 1) medalja = "🥈 ";
      if(index === 2) medalja = "🥉 ";

      html += `
        <tr style="border-bottom: 1px solid #1a1a1a;">
          <td style="padding:15px; font-weight:800; color: ${index < 3 ? 'var(--accent)' : '#666'};">${index + 1}</td>
          <td style="padding:15px; font-weight:600;">${medalja}${stavka[0]}</td>
          <td style="padding:15px; text-align:right; font-weight:bold; color:var(--accent);">${stavka[1]}</td>
        </tr>`;
    });

    html += '</table>';
    container.innerHTML = html;
  }

  // Pokreni odmah
  ucitajRezultate();
</script>

</body>
</html>
