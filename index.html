  <meta charset="UTF-8" />

  <link rel="stylesheet" href="./style.css"> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<body>

<header class="banner">
  <img src="zops_logo.png" alt="ZOPS Logo">
  <span>Najbolji Balkanski YouTuber</span>
</header>

<main class="container main-voting-container">
  <h1>🏆 Izaberi svoj Top 5</h1>
  <p class="subtitle">
    1. Dodirni ime jutjubera sa liste.<br>
    2. Izaberi broj (1-5) u koji želiš da ga postaviš.<br>
    <span>(Ako pogrešiš, samo klikni na popunjeno mesto da ga vratiš nazad)</span>
  </p>

  <div class="voting-section">
    <div class="youtubers-grid" id="youtubersList"></div>

    <div class="ranking-zone">
      <h3>Tvoj Izbor:</h3>
      
      <div class="rank-slot" id="slot-1">
        <span>1.</span> 
        <div class="drop-area">Prazno</div>
      </div>

      <div class="rank-slot" id="slot-2">
        <span>2.</span> 
        <div class="drop-area">Prazno</div>
      </div>

      <div class="rank-slot" id="slot-3">
        <span>3.</span> 
        <div class="drop-area">Prazno</div>
      </div>

      <div class="rank-slot" id="slot-4">
        <span>4.</span> 
        <div class="drop-area">Prazno</div>
      </div>

      <div class="rank-slot" id="slot-5">
        <span>5.</span> 
        <div class="drop-area">Prazno</div>
      </div>
      
      <div class="actions">
        <button id="submitVote">Potvrdi i Glasaj</button>
        <button id="viewResults" onclick="window.location.href='rezultati.html'">
          📊 Vidi trenutne rezultate
        </button>
      </div>
      <p id="msg"></p>
    </div>
  </div>
</main>
